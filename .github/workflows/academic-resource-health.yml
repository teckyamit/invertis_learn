name: Academic Resource Health & Integrity Check

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  verify-resources:
    name: Verify Curated Academic Links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Academic Resource Health Monitor
        run: node scripts/monitor-resource-health.js

      - name: Run Academic Integrity Suite
        run: node scripts/verify-curated-cse-resources.js
