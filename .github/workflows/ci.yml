name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runnerpassword
          POSTGRES_DB: invertis_learn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://runner:runnerpassword@localhost:5432/invertis_learn_test"
      DIRECT_URL: "postgresql://runner:runnerpassword@localhost:5432/invertis_learn_test"
      PRIVATE_STORAGE_PATH: "./public/uploads"
      CURATOR_ACCESS_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Initialize & Seed Database for Build
        run: |
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Verify Production Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Regression Tests
        run: |
          npx next start -H 127.0.0.1 -p 3000 &
          SERVER_PID=$!
          node -e "const http=require('http'); function ping(t=30){http.get('http://127.0.0.1:3000/api/health',r=>{if(r.statusCode===200)process.exit(0);else retry(t);}).on('error',()=>retry(t));} function retry(t){if(t<=0){process.exit(1);}setTimeout(()=>ping(t-1),1000);} ping();"
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npm run test:regression

